services:
  - type: web
    name: mex-warsystem
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python preflight.py && gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT main:app
    healthCheckPath: /health/ready
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: MASTER_WALLET
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PORT
        value: "10000"
