name: Python checks

on:
  push:
    branches: ["main", "audit/first-release-readiness"]
  pull_request:
    branches: ["main"]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python source
        run: python -m compileall -q .
      - name: Run configuration preflight tests
        run: python -m unittest discover -s tests -v
